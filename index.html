<script>
  // Prevent Theme Flash on Initial Load
  (function() {
    try {
      const savedTheme = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    } catch (e) {}
  })();
</script>

<script>
  // Prevent Font-zoom flash on Initial Load (theme script sathe j)
  (function() {
    try {
      const savedZoom = localStorage.getItem('fontZoom');
      const zoom = savedZoom ? Number(savedZoom) : 100;
      if (zoom >= 80 && zoom <= 130) {
        document.documentElement.style.setProperty('--font-scale', String(zoom / 100));
      }
    } catch (e) {}
  })();
</script>
